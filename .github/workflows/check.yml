name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm audit
      - name: Bundle web Worker (no deployment)
        run: npx wrangler deploy --dry-run --config wrangler.web.jsonc --outdir "$RUNNER_TEMP/understory-web"
      - name: Bundle pipeline Worker (no deployment)
        run: npx wrangler deploy --dry-run --config wrangler.pipeline.jsonc --outdir "$RUNNER_TEMP/understory-pipeline"
